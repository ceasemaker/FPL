services:
  # Django Web Service - Starter Plan ($7/month)
  # Serves the API *and* the built React app (frontend/dist via WhiteNoise);
  # there is deliberately no separate frontend service.
  - type: web
    name: fpl-pulse-web
    env: python
    region: oregon
    plan: starter
    buildCommand: ./build.sh
    startCommand: |
      cd django_etl
      supervisord -c ../supervisord.conf
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: USE_POSTGRES
        value: true
      - key: ALLOWED_HOSTS
        value: 'aerofpl.net,www.aerofpl.net,api.aerofpl.net,.onrender.com'
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://www.aerofpl.net,https://aerofpl.net,https://fpl-pulse-web-8u1j.onrender.com'
      - key: SOFASPORT_API_KEY
        sync: false
      - key: SOFASPORT_API_HOST
        value: sofasport.p.rapidapi.com
      - key: DATABASE_URL
        fromDatabase:
          name: fpl-pulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fpl-pulse-redis
          property: connectionString
    healthCheckPath: /api/landing/

  # Redis Key Value - Free Plan
  - type: keyvalue
    name: fpl-pulse-redis
    region: oregon
    plan: free
    ipAllowList: []

# PostgreSQL Database
databases:
  # PostgreSQL - Basic 256MB Plan (cheapest paid plan)
  - name: fpl-pulse-db
    databaseName: fpl_db
    user: fpl_user
    region: oregon
    plan: basic-256mb
    ipAllowList: []
